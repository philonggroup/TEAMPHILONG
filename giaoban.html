<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giao ban tuần · Phi Long Auto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230A4DA2'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='24' font-weight='bold' fill='%23fff' text-anchor='middle'%3EPLG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0A4DA2; --brand-d:#073A7A; --brand-l:#E8F0FA; --accent:#FCE500;
  --ink:#16202B; --ink2:#49586A; --ink3:#8795A6;
  --line:#DCE4EC; --bg:#F2F6FA; --card:#FFFFFF;
  --tim:#6B4FA8; --tim-bg:#F0EBF9;
  --xanh:#1E7A4C; --xanh-bg:#E6F4EC;
  --vang:#8A6400; --vang-bg:#FFF6DC;
  --do:#B5503C; --do-bg:#FBEBE7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Be Vietnam Pro',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{font-family:inherit}
a{color:var(--brand)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.plg{width:38px;height:38px;border-radius:9px;background:#fff;color:var(--brand);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.5px}
.ttl{font-size:17px;font-weight:800;letter-spacing:.3px;line-height:1.2}
.sub{font-size:12px;color:#C5D8F0}
.top .grow{flex:1}
.tmr{display:flex;flex-direction:column;align-items:center;min-width:116px;padding:3px 12px;border-radius:9px;background:#fff;color:var(--brand-d)}
.tmr .cap{font-size:10px;font-weight:800;letter-spacing:.6px}
.tmr .big{font-size:27px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tmr.warn{background:var(--accent);color:#5B4A00}
.tmr.over{background:#B5503C;color:#fff}
.btn{min-height:40px;padding:0 13px;border-radius:8px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.lite{background:#fff;color:var(--brand);border-color:#fff}
select.wk{min-height:40px;border-radius:8px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:700;padding:0 8px;font-family:inherit}
select.wk option{color:#16202B}

/* ---------- layout ---------- */
.wrap{display:flex;align-items:flex-start;gap:0;min-height:calc(100vh - 58px)}
.rail{width:232px;flex-shrink:0;background:var(--brand-d);color:#fff;padding:14px 10px;min-height:calc(100vh - 58px)}
.stepb{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 9px;border-radius:7px;border:0;background:transparent;color:#C5D8F0;font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px}
.stepb:hover{background:rgba(255,255,255,.1);color:#fff}
.stepb[aria-current="true"]{background:#fff;color:var(--brand-d);font-weight:800}
.stepb .no{width:22px;height:22px;border-radius:11px;background:rgba(255,255,255,.16);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stepb[aria-current="true"] .no{background:var(--brand);color:#fff}
.stepb .nm{flex:1;min-width:0}
.stepb .mi{font-size:11.5px;opacity:.9}
.railnote{margin-top:12px;background:rgba(255,255,255,.1);border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.45;color:#DCE8F6}
main{flex:1;min-width:0;padding:16px 20px 60px}

/* ---------- generic ---------- */
h1.pg{margin:0;font-size:23px;font-weight:800;color:var(--brand-d)}
.eyebrow{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.9px;margin-bottom:2px}
.lead{color:var(--ink2);font-size:13.5px;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.mt12{margin-top:12px}.mt16{margin-top:16px}.mt8{margin-top:8px}
.muted{color:var(--ink2);font-size:12.5px}
.tiny{font-size:11.5px;color:var(--ink3)}
.pill{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.t-tim{background:var(--tim-bg);color:var(--tim)}
.t-xanh{background:var(--xanh-bg);color:var(--xanh)}
.t-vang{background:var(--vang-bg);color:var(--vang)}
.t-do{background:var(--do-bg);color:var(--do)}
.t-nil{background:#EDF1F5;color:var(--ink2)}
.bar{height:6px;border-radius:3px;background:#EDF1F5;overflow:hidden;margin-top:5px}
.bar i{display:block;height:6px;border-radius:3px}
.b-tim{background:var(--tim)}.b-xanh{background:var(--xanh)}.b-vang{background:#D9A400}.b-do{background:var(--do)}
input[type=text],input[type=date],textarea,select.inp{width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 9px;background:#fff}
textarea{min-height:62px;resize:vertical}
label.lb{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:3px}
.actbtn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.actbtn.ghost{background:#fff;color:var(--brand)}
.hide{display:none!important}

/* ---------- step 3 ---------- */
.kpi4{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.kpi4 .lbl{font-size:12px;color:var(--ink2);font-weight:600}
.kpi4 .val{font-size:22px;font-weight:800;color:var(--brand-d);margin-top:1px}
.kpi4 .of{font-size:12px;color:var(--ink2);font-weight:500}
.cnhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.cnname{font-size:17px;font-weight:800;color:var(--brand-d)}
.tile{width:100%;text-align:left;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;cursor:pointer;display:block;margin-bottom:6px}
.tile:hover{border-color:var(--brand)}
.tile[aria-expanded="true"]{border-color:var(--brand);background:#F7FAFE}
.tile .tl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tile .nmx{font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:.4px}
.tile .hl{display:flex;align-items:baseline;gap:5px;margin-top:2px}
.tile .hv{font-size:18px;font-weight:800;color:var(--brand-d)}
.sublist{margin:4px 0 2px;padding:0;list-style:none}
.sublist li{display:grid;grid-template-columns:1fr 62px 56px;gap:6px;align-items:center;padding:4px 0;border-top:1px solid #EEF2F6;font-size:12.5px}
.sublist li span.n{color:var(--ink);font-weight:500}
.sublist li span.v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- lists ---------- */
.item{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;margin-bottom:8px}
.item.done{background:#F6FBF8;border-color:#CFE7DA}
.item .hd{display:flex;align-items:flex-start;gap:9px}
.item .bd{font-size:13.5px;font-weight:600;line-height:1.4;flex:1;min-width:0}
.item .who{font-size:12px;color:var(--brand);font-weight:700;margin-top:2px}
.item .dt{font-size:11.5px;color:var(--ink3);font-weight:700;white-space:nowrap}
.ck{width:20px;height:20px;flex-shrink:0;margin-top:2px;accent-color:#1E7A4C}
.tagnhom{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.5px;color:var(--brand);background:var(--brand-l);border-radius:4px;padding:1px 6px;margin-bottom:4px}
.empty{color:var(--ink3);font-size:13px;font-style:italic;padding:6px 0}

/* ---------- bảng chốt việc (bước 6) ---------- */
.ctbl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ctrow{display:grid;grid-template-columns:36px minmax(0,1fr) 176px 108px 94px}
.ctrow>.c{padding:9px 11px;border-bottom:1px solid var(--line);min-width:0}
.ctrow:last-child>.c{border-bottom:0}
.ctrow.alt>.c{background:#FAFBFC}
.cthead>.c{background:#F2F6FA;font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--ink3);padding:7px 11px;text-transform:uppercase}
.c-no{text-align:center;font-weight:800;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.c-viec{font-size:13.5px;font-weight:600;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.c-viec .sub{display:block;font-size:10.5px;font-weight:800;color:var(--brand);letter-spacing:.5px;margin-bottom:4px;text-transform:uppercase}
.c-nguoi{font-size:12.5px;font-weight:700;color:var(--brand-d);line-height:1.5;overflow-wrap:anywhere}
.c-han{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.c-tuan{font-size:11.5px;font-weight:700;color:var(--ink3);white-space:nowrap}
.ctmiss{color:#C2410C;font-weight:800}
.appbtn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #E0A800;background:#F2B705;color:#1F2937;font-size:13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
@media(max-width:860px){
  .cthead{display:none}
  .ctrow{grid-template-columns:30px minmax(0,1fr);border-bottom:1px solid var(--line);padding:5px 0}
  .ctrow:last-child{border-bottom:0}
  .ctrow>.c{border-bottom:0;padding:3px 10px;background:none!important}
  .c-no{grid-row:span 4;text-align:left}
  .c-nguoi::before{content:'Người: ';color:var(--ink3);font-weight:700}
  .c-han::before{content:'Hạn: ';color:var(--ink3);font-weight:700}
  .c-tuan::before{content:'Tuần: ';color:var(--ink3);font-weight:700}
}

/* ---------- audit ---------- */
.auditwrap{position:fixed;inset:0;background:rgba(10,30,60,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
.auditbox{background:#fff;border-radius:12px;max-width:860px;width:100%;padding:18px 20px}
.audline{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid #EEF2F6;font-size:13px}
.audline .k{font-weight:800;white-space:nowrap}
.okmark{color:var(--xanh);font-weight:800}
.warnmark{color:var(--do);font-weight:800}

/* ---------- loading ---------- */
.loadbox{padding:40px 20px;text-align:center;color:var(--ink2)}
.spin{width:28px;height:28px;border:3px solid #DCE4EC;border-top-color:var(--brand);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:880px){
  .wrap{flex-direction:column}
  .rail{width:100%;min-height:0;display:flex;gap:4px;overflow-x:auto;padding:10px}
  .stepb{width:auto;flex-shrink:0;margin:0}
  .stepb .mi{display:none}
  .railnote{display:none}
  .grid3,.grid4{grid-template-columns:1fr}
  main{padding:14px}
}
@media print{
  .top,.rail,.noprint{display:none!important}
  body{background:#fff}
  main{padding:0}
}

/* ====== ĐƯỜNG ĐUA & BỤC VINH DANH (trực quan cho KTV) ====== */
.dua{background:linear-gradient(180deg,#0B2A4A,#0A1C30);border-radius:14px;padding:14px 14px 10px;color:#fff}
.dua-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.dua-h b{font-size:16px;letter-spacing:.4px}
.dua-h span{font-size:12px;color:#9FC2E6}
.lan{display:flex;align-items:center;gap:10px;margin:10px 0}
.lan-ten{width:54px;font-weight:800;font-size:16px;letter-spacing:.5px}
.lan-duong{position:relative;flex:1;height:56px;border-radius:9px;border:1px solid #27476b;overflow:hidden;
  background:repeating-linear-gradient(90deg,#16304d 0 30px,#142b45 30px 60px)}
.lan-duong:before{content:'';position:absolute;left:0;right:0;top:52%;height:3px;margin-top:-1px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 16px,transparent 16px 34px)}
.vach{position:absolute;top:0;bottom:0;width:0;border-left:4px dashed #FCE500;opacity:.9}
.vach i{position:absolute;top:3px;left:7px;font-size:10px;color:#FCE500;font-weight:800;font-style:normal;white-space:nowrap}
.xe-dua{position:absolute;bottom:5px;transform:translateX(-50%);transition:left .7s ease}
.lan-so{width:104px;text-align:right}
.lan-so b{display:block;font-size:24px;font-weight:800;line-height:1.05}
.lan-ghi{font-size:11.5px;color:#9FC2E6;margin:2px 0 0 64px}
.buc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.buc-o{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.buc-o .ten{font-size:20px;font-weight:800;margin-top:4px}
.buc-o .so{font-size:34px;font-weight:800;line-height:1.1;margin-top:2px}
.buc-chan{margin:10px -10px -12px;border-radius:0 0 11px 11px;padding:7px;font-weight:800;font-size:12.5px;letter-spacing:.4px}
.ics{vertical-align:middle;flex:0 0 auto}
.ic-o{display:inline-flex;align-items:center;justify-content:center;background:#F2F6FA;border-radius:9px;padding:4px;margin-right:7px}
.sublist .n{display:flex;align-items:center;gap:7px}
.cv-item{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-top:1px solid #EEF2F6}
.cv-dau{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;color:#fff}
.cv-noi{font-size:13.5px;font-weight:600;line-height:1.35}
.cv-meta{font-size:11.5px;color:var(--ink3);margin-top:2px}
@media print{.dua{background:#0B2A4A !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ====== CODE CHUẨN BƯỚC 3 · 4 · 5 (theo màn demo chuẩn của giaoban.html) ====== */
.kpirow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:1180px){.kpirow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.kpirow{grid-template-columns:1fr}}
.mini4{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:4px}
.mini4 .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;width:34px}
.mini4 .c i{display:block;width:20px;border-radius:3px 3px 0 0}
.mini4 .c .p{font-size:10.5px;font-weight:700;color:var(--ink)}
.mini4 .c .w{font-size:10.5px;color:var(--ink2)}
.docnhanh{background:#EAF2F8;border-radius:6px;padding:6px 9px;font-size:12.5px;font-weight:600;color:var(--brand-d);margin-top:6px}
.crow5{display:grid;grid-template-columns:84px minmax(0,1fr) 44px 62px;gap:6px;align-items:center;padding:5px 0;border-top:1px solid #EEF2F6;font-size:12.5px}
.crow5 .nh{color:var(--ink2);font-size:11.5px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 104px 44px 62px;gap:6px;align-items:center;padding:4px 0;border-top:1px solid #EEF2F6;font-size:12.5px}
.crow .tn,.crow5 .tn{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600}
.crow .so{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.crow .pc,.crow5 .pc{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.crow .bd,.crow5 .bd{text-align:right}
@media(max-width:560px){.crow{grid-template-columns:minmax(0,1fr) 84px 40px 56px;font-size:11.5px}
  .crow5{grid-template-columns:70px minmax(0,1fr) 40px 56px;font-size:11.5px}}
.chuaco{color:#C2410C;font-weight:700}
.nxbox{background:var(--vang-bg);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:flex-start}
.nxbox .lb2{font-size:11.5px;font-weight:800;color:var(--vang);letter-spacing:.4px;white-space:nowrap;padding-top:2px;line-height:1.3}
.nx3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;font-size:13px;line-height:1.45}
@media(max-width:880px){.nx3{grid-template-columns:1fr}}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:7px;border-top:1px solid #EEF2F6;margin-top:8px;flex-wrap:wrap}
.cbtn{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:7px;background:var(--brand);color:#fff;border:0;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.cbtn:hover{background:var(--brand-d)}
.cnnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.cnnav button{min-height:38px;padding:0 13px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--brand-d);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.cnnav button[aria-current="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.ctwrap{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.ctleft{flex:1.12 1 340px;min-width:0;display:flex;flex-direction:column;gap:10px}
.ctright{flex:.88 1 290px;min-width:0}
.ct2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@media(max-width:700px){.ct2{grid-template-columns:1fr}}
.ckhoi{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.ckhoi .ch{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.5px}
.gt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.gtdo{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--do-bg);border-radius:6px;padding:6px 9px;font-size:12.5px;margin-top:4px}
.ht3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:980px){.ht3{grid-template-columns:1fr}}
.htcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.htcard.pick{border-color:var(--brand);border-width:2px}
.htgrid{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 10px;font-size:12.5px;line-height:1.4}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.g4{grid-template-columns:1fr}}
.gbox{background:#EAF2F8;border-radius:7px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.gbox .gt1{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.4px}
.gbox .gm{font-size:11.5px;color:var(--ink2);line-height:1.3;min-height:30px}
.grow2{display:flex;align-items:center;gap:7px;font-size:13px}
.grow2 .dot{width:13px;height:13px;border-radius:7px;flex-shrink:0}
.grow2 .nm2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow2 .sx{font-weight:800;color:var(--brand-d);white-space:nowrap;font-variant-numeric:tabular-nums}
#vdHost{display:block}
#vdHost.hide{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div class="plg">PLG</div>
  <div>
    <div class="ttl">GIAO BAN TUẦN · PHI LONG AUTO</div>
    <div class="sub" id="subTitle">Đang tải số liệu 3 chi nhánh…</div>
  </div>

function num(s){

  if(s.indexOf(',')>-1 && s.indexOf('.')>-1) s=s.replace(/\./g,'').replace(',','.');

}
function fm(n){ return (n===null||n===undefined)?'—':Math.round(n).toLocaleString('vi-VN'); }

  return fm(x);
}
function parseCSV(t){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  row.push(f); rows.push(row); return rows;
}

      iNg=cvCol(head,'ho_va_ten'), iPb=cvCol(head,'phong_ban'), iTt=cvCol(head,'trang_thai');

/* --------------------------- tuần trong tháng (tab KPI) --------------------------- */
function weeksKPI(rows){
  var r=(rows&&rows[1])||[], out=[];
  for(var i=0;i<r.length;i++){
    var s=strip(r[i]); if(noAcc(s).indexOf('tuan')!==0) continue;
    var tail = s.indexOf('·')>-1 ? s.split('·').slice(1).join('·') : s;
    var md=/(\d{1,2})\D+(\d{1,2})\s*\/\s*(\d{1,2})/.exec(tail);
    var no=/(\d{1,2})/.exec(s);
    out.push({ col:i, label:s, no:no?+no[1]:out.length+1,
               d1:md?+md[1]:null, d2:md?+md[2]:null, m:md?+md[3]:null });
  }
  /* dòng 2 còn 1 nhãn "TUẦN 1" nữa đứng đầu khối cột ngày (sau cột THÁNG):
     nhãn đó không có dải ngày nên bỏ ra, để dải tuần không bị thừa 1 cột. */
  var dated=out.filter(function(w){ return w.d1!==null; });
  return dated.length?dated:out;
}
function pickWeekKPI(ws,ref){
  if(!ws.length) return null;
  var d=ref.getDate(), m=ref.getMonth()+1, i;
  for(i=0;i<ws.length;i++) if(ws[i].m===m && ws[i].d1!==null && d>=ws[i].d1 && d<=ws[i].d2) return ws[i];
  for(i=ws.length-1;i>=0;i--) if(ws[i].d1!==null && ws[i].m===m && d>ws[i].d2) return ws[i];
  return ws[0];
}
function ngayXem(rows){
  for(var i=0;i<Math.min(6,rows.length);i++){
    var r=rows[i]||[];
    if(noAcc(r[1]||'').indexOf('chon ngay')>-1) return strip(r[2]||r[3]||'');
  }
  return '';
}
function dmyToDate(s){
  var m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(strip(s)); if(!m) return null;
  return new Date(+m[3],+m[2]-1,+m[1]);
}

/* --------------------------- tuần trong quý (tab KH 90 ngày) --------------------------- */
function weeksKH(rows){
  var r=(rows&&rows[2])||[], out=[], Y=Q4YEAR();
  for(var i=0;i<r.length;i++){
    var s=strip(r[i]); var mw=/^W\s*(\d{1,2})/i.exec(s); if(!mw) continue;
    var md=/(\d{1,2})\s*\/\s*(\d{1,2})\D+(\d{1,2})\s*\/\s*(\d{1,2})/.exec(s);
    var o={ col:i, w:+mw[1], label:s };
    if(md){ o.from=new Date(Y,+md[2]-1,+md[1]); o.to=new Date(Y,+md[4]-1,+md[3]);
            o.txt=md[1]+'/'+md[2]+'–'+md[3]+'/'+md[4]; }
    out.push(o);
  }
  return out;
}
function pickWeekKH(ws,ref){
  if(!ws.length) return null;
  var i;
  for(i=0;i<ws.length;i++) if(ws[i].from && ref>=ws[i].from && ref<=ws[i].to) return ws[i];
  for(i=ws.length-1;i>=0;i--) if(ws[i].to && ref>ws[i].to) return ws[i];
  return ws[0];
}

/* --------------------------- lấy 1 chỉ số --------------------------- */
function findDef(rows,def){
  var k=def.match, hint=def.row-1;
  if(rows[hint] && noAcc(rows[hint][1]||'').indexOf(k)>-1) return {r:rows[hint],at:def.row,moved:false};
  for(var i=0;i<rows.length;i++){
    if(noAcc(rows[i][1]||'').indexOf(k)>-1) return {r:rows[i],at:i+1,moved:true};
  }
  return null;
}
function cellv(r,i){ return (r&&r[i]!==undefined)?r[i]:''; }

/* số của 1 chỉ số cho 1 chi nhánh: ngày + tuần trong tháng */
function metric(cn,def){
  var rows=DATA[cn]&&DATA[cn].kpi; if(!rows) return null;
  var f=findDef(rows,def); if(!f) return null;
  var wm=DATA[cn]._wm;
  var out={ ten:def.ten, k:def.k, the:def.the, money:!!def.money, at:f.at, moved:f.moved,
            dTt:num(cellv(f.r,2)), dKpi:num(cellv(f.r,3)), wTt:null, wKpi:null, wLabel:'' };
  if(wm){ out.wKpi=num(cellv(f.r,wm.col)); out.wTt=num(cellv(f.r,wm.col+1)); out.wLabel=wm.label; }
  out.dPct = (out.dKpi && out.dTt!==null) ? out.dTt/out.dKpi*100 : null;
  out.wPct = (out.wKpi && out.wTt!==null) ? out.wTt/out.wKpi*100 : null;
  return out;
}
function allMetrics(cn){
  if(DATA[cn] && DATA[cn]._met) return DATA[cn]._met;
  var o={}; ALLDEFS.forEach(function(d){ o[d.k]=metric(cn,d); });
  if(DATA[cn]) DATA[cn]._met=o;
  return o;
}

/* --------------------------- KH 90 ngày: mục tiêu + hành động --------------------------- */
function goalsOf(cn){
  var rows=DATA[cn]&&DATA[cn].kh; if(!rows) return [];
  if(DATA[cn]._goals) return DATA[cn]._goals;
  var out=[], nhom='', nhomTen='';
  for(var i=4;i<rows.length;i++){
    var r=rows[i]||[];
    var b=strip(r[1]||''), nb=noAcc(b);
    if(nb.indexOf('tai viec')>-1 || nb.indexOf('tra soat tu dong')>-1) break;
    if(b) nhom=b;
    var craw=String(r[2]||'').split('\n')[0];
    if(strip(craw)) nhomTen=strip(craw).replace(/\(.*$/,'').trim();
    var d=strip(r[3]||''); if(!d) continue;
    out.push({ i:i+1, nhom:nhom, nhomTen:nhomTen, ten:d,
               pic:strip(r[7]||''), dan:strip(r[21]||''), kq:strip(r[22]||''), row:r });
  }
  if(DATA[cn]) DATA[cn]._goals=out;
  return out;
}
function parseActions(txt){
  var s=keepNl(txt).replace(/^"+|"+$/g,'').trim();
  if(!s) return [];
  var blocks=s.split(/\n(?=\s*"?\s*\d{1,2}\/\d{1,2}\/\d{4})/);
  var out=[];
  blocks.forEach(function(b){
    b=b.replace(/"/g,' ');
    var parts=b.split('👤');
    var body=parts.shift()||'';
    var who=parts.length?parts.join(' · '):'';
    var md=/(\d{1,2}\/\d{1,2}\/\d{4})/.exec(body) || /(\d{1,2}\/\d{1,2}\/\d{4})/.exec(b);
    var ngay=md?md[1]:'';
    body=strip(body.replace(/\d{1,2}\/\d{1,2}\/\d{4}/g,' ').replace(/^[·\-–•\s]+/,''));
    who=strip(who.replace(/\d{1,2}\/\d{1,2}\/\d{4}/g,' ').replace(/^[·\-–•\s]+/,''));
    if(body||who) out.push({ ngay:ngay, noi:body, nguoi:who });
  });
  return out;
}
/* hành động của 1 tuần quý, gộp cả 3 chi nhánh hoặc 1 chi nhánh */
function actionsOf(cn,wk){
  if(!wk) return [];
  var gs=goalsOf(cn), out=[];
  gs.forEach(function(g){
    parseActions(cellv(g.row,wk.col)).forEach(function(a){
      out.push({ cn:cn, nhom:g.nhom, nhomTen:g.nhomTen, mucTieu:g.ten,
                 pic:g.pic, dan:g.dan, ngay:a.ngay, noi:a.noi,
                 nguoi:a.nguoi||g.pic, key:cn+'|'+g.i+'|'+wk.w+'|'+noAcc(a.noi).slice(0,40) });
    });
  });
  return out;
}

/* ========================= BƯỚC 3 · TOÀN CẢNH (CODE CHUẨN) =========================
   Dựng đúng cấu trúc màn chuẩn của giaoban.html:
     dải 4 ô chỉ số toàn công ty + cột 4 tuần · nhận xét 3 câu ·
     3 thẻ chi nhánh (5 dòng nhóm, nút "Chi tiết và giải trình") · dòng CSKH.
   Thêm duy nhất 1 hình trực quan: đường đua doanh thu tuần (cho nhóm KTV).   */
var CN_VIEW = null;        /* null = toàn cảnh · 'CN1'|'CN2'|'CN3' = màn giải trình */
function goCn(c){ CN_VIEW = c || null; paintStage(); window.scrollTo(0,0); }
function ten(c){ return SRC[c] ? SRC[c].ten : c; }
function defByKey(k){ for(var i=0;i<ALLDEFS.length;i++) if(ALLDEFS[i].k===k) return ALLDEFS[i]; return null; }
function valTxt(df,v){
  if(v===null||v===undefined) return '—';
  if(df&&df.rate) return (Math.round(v*10)/10).toLocaleString('vi-VN')+'%';
  return (df&&df.money)?fmShort(v):fm(v);
}
function mauBar(t){ return t==='tim'?'#4B2E83':t==='xanh'?'#2F75B5':t==='vang'?'#D9A400':t==='do'?'#B42318':'#C9D6E4'; }
function wkLabel(){
  for(var i=0;i<CNS.length;i++){ var d=DATA[CNS[i]]; if(d&&d._wm) return d._wm.label; }
  return '';
}
/* tổng 1 chỉ số của cả 3 chi nhánh trong tuần đang xem */
function sumKey(k){
  var tt=0,kpi=0,any=false;
  CNS.forEach(function(c){
    var m=allMetrics(c)[k]; if(!m) return;
    if(m.wTt!==null){ tt+=m.wTt; any=true; }
    if(m.wKpi!==null) kpi+=m.wKpi;
  });
  return any?{tt:tt,kpi:kpi,pct:kpi?tt/kpi*100:null}:{tt:null,kpi:null,pct:null};
}
/* dải tuần của 1 chỉ số: 4 tuần gần nhất tính tới tuần đang xem (c=null là gộp 3 CN) */
function weekSeries(c,k){
  var cs = c?[c]:CNS, base=null, i;
  for(i=0;i<cs.length;i++){ var d0=DATA[cs[i]]; if(d0&&d0._wks&&d0._wks.length){ base=d0._wks; break; } }
  if(!base) return [];
  var df=defByKey(k); if(!df) return [];
  var cur=null;
  for(i=0;i<cs.length;i++){ var d1=DATA[cs[i]]; if(d1&&d1._wm){ cur=d1._wm.col; break; } }
  var out=[];
  base.forEach(function(w){
    if(cur!==null && w.col>cur) return;
    var tt=0,kpi=0,any=false;
    cs.forEach(function(cn){
      var d=DATA[cn]; if(!d||!d.kpi) return;
      var f=findDef(d.kpi,df); if(!f) return;
      var a=num(cellv(f.r,w.col+1)), b=num(cellv(f.r,w.col));
      if(a!==null){ tt+=a; any=true; }
      if(b!==null) kpi+=b;
    });
    out.push({ no:w.no, pct:(any&&kpi)?tt/kpi*100:null });
  });
  return out.slice(-4);
}
function mini4(ser,cap){
  if(!ser.length) return '<div class="tiny">chưa đọc được dải tuần</div>';
  var mx=100; ser.forEach(function(s){ if(s.pct!==null&&s.pct>mx) mx=s.pct; });
  var h='<div>'+(cap?'<div class="lbl">'+esc(cap)+'</div>':'')+'<div class="mini4">';
  ser.forEach(function(s){
    var hh = s.pct===null?3:Math.max(4,Math.round(s.pct/mx*52));
    h+='<div class="c"><span class="p">'+pctTxt(s.pct)+'</span>'
      +'<i style="height:'+hh+'px;background:'+mauBar(tone(s.pct))+'"></i>'
      +'<span class="w">T'+s.no+'</span></div>';
  });
  return h+'</div></div>';
}
/* 1 dòng "đọc nhanh" tự rút từ số thật */
function docNhanh(c){
  var mets=allMetrics(c), best=null, worst=null;
  DEFS.forEach(function(df){
    var m=mets[df.k]; if(!m||m.wPct===null) return;
    if(!best||m.wPct>best.p) best={ten:df.ten,p:m.wPct};
    if(!worst||m.wPct<worst.p) worst={ten:df.ten,p:m.wPct};
  });
  if(!best) return 'chưa đọc được số tuần';
  return best.ten+' tốt nhất '+pctTxt(best.p)+' · yếu nhất '+worst.ten+' '+pctTxt(worst.p);
}
function demMuc(c){
  var mets=allMetrics(c), bad=0, good=0;
  DEFS.forEach(function(df){ var m=mets[df.k]; if(!m) return; var t=tone(m.wPct);
    if(t==='do'||t==='vang') bad++; if(t==='xanh'||t==='tim') good++; });
  return {bad:bad,good:good};
}
/* 2 chỉ số yếu nhất của 1 chi nhánh (chỉ số lên tiếng) */
function loTieng(c){
  var mets=allMetrics(c), L=[];
  DEFS.forEach(function(df){ var m=mets[df.k]; if(!m||m.wPct===null) return;
    var t=tone(m.wPct); if(t!=='do'&&t!=='vang') return;
    L.push({df:df,m:m}); });
  L.sort(function(a,b){ return a.m.wPct-b.m.wPct; });
  return L.slice(0,2);
}
/* 3 câu nhận xét, rút thẳng từ số tuần — không gõ tay */
function nhanXet(){
  var s=sumKey('dt'), ser=weekSeries(null,'dt');
  var prev = ser.length>1 ? ser[ser.length-2].pct : null;
  var c1='<b>'+pctTxt(s.pct)+' doanh thu tuần</b> · '+fmShort(s.tt)+' / '+fmShort(s.kpi)
    + (prev!==null ? (' · tuần trước '+pctTxt(prev)+', '+((s.pct!==null&&s.pct>=prev)?'đang lên':'đang xuống')) : '');
  var rank=xepHangCN(), top=rank[0], nTop=0;
  if(top){ var mt=allMetrics(top.c);
    DEFS.forEach(function(df){ var m=mt[df.k]; if(m&&(tone(m.wPct)==='xanh'||tone(m.wPct)==='tim')) nTop++; }); }
  var c2 = top ? ('<b>'+esc(ten(top.c))+' dẫn hệ thống</b>: doanh thu '+pctTxt(top.p)+' · '+nTop+'/12 chỉ số từ Đạt trở lên.')
               : 'Chưa đọc được số của chi nhánh nào.';
  var wk=null;
  DEFS.forEach(function(df){
    var tot=0,n=0,low=null;
    CNS.forEach(function(c){ var m=allMetrics(c)[df.k];
      if(m&&m.wPct!==null){ tot+=m.wPct; n++; if(!low||m.wPct<low.p) low={c:c,p:m.wPct}; } });
    if(!n) return; var avg=tot/n;
    if(!wk||avg<wk.avg) wk={ten:df.ten,avg:avg,low:low};
  });
  var c3 = wk ? ('<b>Nút thắt chung: '+esc(wk.ten)+' '+pctTxt(wk.avg)+'</b> · nặng nhất ở '+esc(ten(wk.low.c))+' '+pctTxt(wk.low.p)+'.')
              : '—';
  return [c1,c2,c3];
}

/* ========================= BƯỚC 5 · CẦN HỖ TRỢ (CODE CHUẨN) =========================
   Chốt từ KẾT QUẢ của tab "Kế hoạch 90 ngày quý 4" của cả 3 chi nhánh — không số minh hoạ.
   Chuẩn so sánh: % thời gian quý 4 đã đi qua (01/10 → 31/12 = 92 ngày).
   Thứ tự 3 thẻ: chi nhánh xa chuẩn tiến độ nhất đứng đầu; 2 thẻ đầu ĐƯỢC CHỌN (bàn trong
   14 phút), thẻ thứ 3 Xử lý sau họp. Ô KẾT QUẢ Q4 còn "Nhập tay…" / trống / #REF thì ghi
   thẳng "chưa đo", không lấy số nào lấp vào.                                            */
var NHOM4 = [
  { ma:'I',   ten:'I · TIỀN',      row:6,  do:'% KPI doanh thu Q4',      kind:'pct'  },
  { ma:'II',  ten:'II · HỆ THỐNG', row:8,  do:'số dòng cảnh báo số liệu',kind:'canh' },
  { ma:'III', ten:'III · ĐỘI NGŨ', row:10, do:'KPI tuần của nhân sự',    kind:'so'   },
  { ma:'IV',  ten:'IV · CÁ NHÂN',  row:12, do:'điều hành bằng số',       kind:'so'   }
];
/* % thời gian quý 4 đã đi qua */
function q4Prog(){
  var Y=Q4YEAR(), s=new Date(Y,9,1), e=new Date(Y,11,31), d=today0();
  if(d<s) return 0; if(d>e) return 100;
  return (Math.round((d-s)/86400000)+1)/92*100;
}
function kqPct(txt){ var m=/(\d{1,3}(?:[.,]\d+)?)\s*%/.exec(strip(txt)); return m?num(m[1]):null; }
function kqSo(txt){ var m=/(-?[\d][\d.,]*)/.exec(strip(txt)); return m?num(m[1]):null; }
function kqChuaDo(txt){
  var s=strip(txt); if(!s) return true;
  var n=noAcc(s);
  return n.indexOf('nhap tay')>-1 || s.indexOf('#REF')>-1 || s.indexOf('#N/A')>-1 || n.indexOf('chua nhap')>-1;
}
function goalByRow(c,row){
  var gs=goalsOf(c), i;
  for(i=0;i<gs.length;i++) if(gs[i].i===row) return gs[i];
  return null;
}
function goalsChuaDo(c){
  var gs=goalsOf(c), n=0;
  gs.forEach(function(g){ if(kqChuaDo(g.kq)) n++; });
  return { chuaDo:n, tong:gs.length };
}
/* việc của tuần đang chọn thuộc 1 mục tiêu */
function viecCuaMuc(c,g){
  if(!WQ||!g) return [];
  return actionsOf(c,WQ).filter(function(a){ return a.mucTieu===g.ten; });
}
/* 1 thẻ cần hỗ trợ cho 1 chi nhánh: chọn việc theo thứ tự chuẩn */
function htOne(c){
  var chuan=q4Prog();
  var gDt=goalByRow(c,6), gs=goalsOf(c);
  var dtPct = gDt?kqPct(gDt.kq):null;
  var o={ c:c, chuan:chuan, dtPct:dtPct, nhom:'', g:null, vande:'', kq:'', muc:'', viec:'', pic:'' };
  if(!gs.length){ o.vande='Chưa đọc được tab Kế hoạch 90 ngày quý 4'; return o; }
  /* (1) doanh thu Q4 dưới chuẩn tiến độ */
  if(dtPct!==null && dtPct<chuan && gDt){
    o.g=gDt; o.nhom='I · TIỀN';
    o.vande='Doanh thu Q4 mới '+Math.round(dtPct)+'% KPI, dưới chuẩn tiến độ '+Math.round(chuan)+'%';
  }
  /* (2) mục tiêu có chỉ số vẫn bằng 0 cả quý */
  if(!o.g){
    for(var i=0;i<gs.length;i++){
      if(kqChuaDo(gs[i].kq)) continue;
      var v=kqSo(gs[i].kq);
      if(v===0){ o.g=gs[i]; o.nhom=gs[i].nhom+' · '+strip(gs[i].nhomTen); o.vande=gs[i].ten+': chỉ số vẫn bằng 0 cả quý'; break; }
    }
  }
  /* (3) mục tiêu chưa có số đo */
  if(!o.g){
    for(var j=0;j<gs.length;j++){
      if(kqChuaDo(gs[j].kq)){ o.g=gs[j]; o.nhom=gs[j].nhom+' · '+strip(gs[j].nhomTen); o.vande=gs[j].ten+': chưa có số đo'; break; }
    }
  }
  if(!o.g){ o.g=gDt||gs[0]; o.nhom=o.g.nhom+' · '+strip(o.g.nhomTen);
            o.vande='Không có mục tiêu nào dưới chuẩn — giữ nhịp và báo số đúng hạn'; }
  o.kq  = kqChuaDo(o.g.kq)?'':strip(o.g.kq);
  o.muc = strip(cellv(o.g.row,4)).slice(0,160);
  var vs = viecCuaMuc(c,o.g);
  o.viec = vs.length?vs.map(function(a){ return a.noi; }).join(' · '):'';
  o.pic  = strip(o.g.pic)||SRC[c].ql;
  return o;
}
function htList(){
  var L=CNS.map(htOne);
  L.sort(function(a,b){
    var da=(a.dtPct===null)?-999:(a.dtPct-a.chuan);
    var db=(b.dtPct===null)?-999:(b.dtPct-b.chuan);
    return da-db;
  });
  return L;
}

  h+='</div>';

  /* --- dải 4 nhóm mục tiêu × 3 chi nhánh --- */
  h+='<div class="card mt12"><div class="cnhead"><span class="eyebrow">KẾT QUẢ KH 90 NGÀY · 4 NHÓM MỤC TIÊU × 3 CHI NHÁNH</span>'
    +'<span class="muted">'+esc(WQ?WQ.label.replace(/\s+/g,' '):'—')+'</span></div><div class="g4 mt8">';
  NHOM4.forEach(function(nh){
    var tenMuc='';
    for(var i=0;i<CNS.length;i++){ var g0=goalByRow(CNS[i],nh.row); if(g0){ tenMuc=strip(g0.ten); break; } }
    h+='<div class="gbox"><div class="gt1">'+esc(nh.ten)+'</div>'

    CNS.forEach(function(c){

          var p=kqPct(g.kq);
          if(p===null){ so='chưa đo'; }
          else { so=Math.round(p)+'% KPI';
                 var r=p/(q4Prog()||1);

  h+='</div></div>';

  h+='<div class="card mt12 muted">Nhịp 7 phút mỗi việc: 2′ chủ việc trình bày · 2′ cả nhóm hỏi · 2′ góp ý, anh Đại nói sau cùng · 1′ chủ việc tự chốt hành động. '
    +'Mục tiêu “chưa đo” là việc cần chốt người nhập số, không phải việc làm kém.</div>';

/* danh sách chỉ số Đuối/Được — bước 7 và tra soát còn dùng */
function weakList(){
  var out=[];
  CNS.forEach(function(c){
    var mets=allMetrics(c);
    DEFS.forEach(function(df){
      var m=mets[df.k]; if(!m) return;
      var t=tone(m.wPct); if(t!=='do'&&t!=='vang') return;
      out.push({ c:c, k:df.k, ten:df.ten, money:!!df.money, pct:m.wPct,
                 tt:m.wTt, kpi:m.wKpi, thieu:(m.wKpi!==null&&m.wTt!==null)?(m.wKpi-m.wTt):null,
                 owner:ownerFor(c,df.k), t:t });
    });
  });
  out.sort(function(a,b){ return (a.pct===null?999:a.pct)-(b.pct===null?999:b.pct); });
  return out;
}

/* ========================= BƯỚC 6 · CHỐT VIỆC TUẦN ========================= */
function chotList(){
  var out=[];
  var next = WQ?wkByNo(WQ.w+1):null;
  CNS.forEach(function(c){
    if(WQ) actionsOf(c,WQ).forEach(function(a){ a.wkLabel='tuần này'; out.push(a); });
    if(next) actionsOf(c,next).forEach(function(a){ a.wkLabel='tuần tới'; out.push(a); });
  });
  /* việc chốt ngay tại họp: giải trình 60 giây (bước 3) + thẻ cần hỗ trợ (bước 5) */
  CNS.forEach(function(c){
    var v1=strip(sGet('gt_'+c+'_viec',''));
    if(v1) out.push({ cn:c, nhom:'Giải trình chi nhánh', mucTieu:strip(sGet('gt_'+c+'_loi','')),
                      noi:v1, nguoi:sGet('gt_'+c+'_ai',SRC[c].ql), ngay:sGet('gt_'+c+'_han',''),
                      wkLabel:'chốt tại họp', key:'gt_'+c });
    var v2=strip(sGet('ht_'+c+'_viec',''));
    if(v2) out.push({ cn:c, nhom:'Cần hỗ trợ', mucTieu:'KH 90 ngày',
                      noi:v2, nguoi:sGet('ht_'+c+'_nguoi',SRC[c].ql), ngay:sGet('ht_'+c+'_han',''),
                      wkLabel:'chốt tại họp', key:'ht_'+c });
  });
  return out;
}

function chotText(){

function copyChot(){
  var t=chotText();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ alert('Đã chép '+t.split('\n').length+' dòng. Dán vào tab Kế hoạch hành động của chi nhánh.'); },
      function(){ fallbackCopy(t); });

}
function fallbackCopy(t){
  var a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select();
  try{ document.execCommand('copy'); alert('Đã chép danh sách chốt việc.'); }catch(e){ alert('Không chép được, hãy bấm In / lưu PDF.'); }
  document.body.removeChild(a);
}

/* ========================= TRA SOÁT ========================= */
function buildAudit(){
  var A=[];
  CNS.forEach(function(c){
    var d=DATA[c]||{};
    if(!d.kpi) A.push([c,'warn','Không đọc được tab KPI ngày. Kiểm tra chia sẻ file "bất kỳ ai có liên kết · người xem".']);
    if(!d.kh)  A.push([c,'warn','Không đọc được tab Kế hoạch 90 ngày quý 4.']);
    if(!d.kpi) return;
    var nx=ngayXem(d.kpi), nd=dmyToDate(nx), t=today0();
    if(!nd) A.push([c,'warn','Không đọc được ô "Chọn ngày" trên tab KPI ngày.']);
    else {
      var lag=Math.round((t-nd)/86400000);
      if(lag>0) A.push([c,'warn','Ngày xem trên file là '+nx+', trễ '+lag+' ngày so với hôm nay. Số của bước 3 là số tới ngày đó.']);
      else A.push([c,'ok','Ngày xem '+nx+' — số đã cập nhật.']);
    }
    var mets=allMetrics(c), missing=[], moved=[], zeroKpi=[];
    DEFS.forEach(function(df){
      var m=mets[df.k];
      if(!m){ missing.push(df.ten); return; }
      if(m.moved) moved.push(df.ten+' (đang ở dòng '+m.at+', mong đợi dòng '+df.row+')');
      if(m.wKpi===null||m.wKpi===0) zeroKpi.push(df.ten);
    });
    if(missing.length) A.push([c,'warn','Không tìm thấy '+missing.length+' chỉ số: '+missing.join(' · ')]);
    if(moved.length)   A.push([c,'warn','Có chỉ số đã bị dời dòng — trang vẫn đọc đúng vì dò theo tên: '+moved.join(' · ')]);
    if(zeroKpi.length) A.push([c,'warn','KPI tuần bằng 0 hoặc trống nên không tính được % cho: '+zeroKpi.join(' · ')]);
    if(!missing.length && !moved.length && !zeroKpi.length) A.push([c,'ok','Đủ 12 chỉ số, đúng dòng, KPI tuần đều có số.']);
    var missCt=[]; DEFS_CT.forEach(function(df){ if(!mets[df.k]) missCt.push(df.ten); });
    if(missCt.length) A.push([c,'warn','Màn chi tiết thiếu '+missCt.length+' dòng phụ: '+missCt.join(' · ')]);
    var ks=weeksKH(d.kh);
    if(!ks.length) A.push([c,'warn','Không đọc được dải tuần W1–W13 ở dòng 3 tab KH 90 ngày.']);
    var gs=goalsOf(c);
    if(gs.length) {
      var noPic=gs.filter(function(g){ return !strip(g.pic); }).map(function(g){ return g.ten; });
      if(noPic.length) A.push([c,'warn','Mục tiêu chưa ghi P-I-C: '+noPic.join(' · ')]);
      var acts=WQ?actionsOf(c,WQ):[];
      var noWho=acts.filter(function(a){ return !strip(a.nguoi); }).length;
      if(noWho) A.push([c,'warn',noWho+' hành động của tuần này chưa ghi người phụ trách.']);
      A.push([c,'ok','Đọc được '+gs.length+' dòng mục tiêu và '+acts.length+' hành động cho '+(WQ?WQ.label:'tuần hiện tại')+'.']);
      var cd=goalsChuaDo(c);
      if(cd.chuaDo) A.push([c,'warn',cd.chuaDo+'/'+cd.tong+' mục tiêu KH 90 ngày chưa có số ở ô KẾT QUẢ Q4 (còn “Nhập tay…”, trống hoặc lỗi) — bước 5 ghi “chưa đo”, không lấy số khác lấp vào.']);
      else A.push([c,'ok','Cả '+cd.tong+' mục tiêu KH 90 ngày đều có số ở ô KẾT QUẢ Q4.']);
    } else A.push([c,'warn','Không đọc được dòng mục tiêu nào trong KH 90 ngày.']);
  });
  return A;
}
function openAudit(){
  var A=buildAudit();
  var h='<div class="auditbox"><div style="display:flex;justify-content:space-between;align-items:center">'
   +'<div><div class="eyebrow">TRA SOÁT NGUỒN SỐ</div><h1 class="pg">Chất lượng dữ liệu 3 chi nhánh</h1></div>'

    });
    h+='</div>';

  h+='<div class="mt16 muted">Quy ước màu: TÍM trên 107% · XANH 100–107% · VÀNG trên 90% · ĐỎ từ 90% xuống. Phần trăm do trang tự tính từ Thực đạt ÷ KPI, không lấy cột % của sheet, để 3 chi nhánh cùng một thước.</div>';
  h+='</div>';
  var m=document.getElementById('auditModal'); m.innerHTML=h; m.classList.remove('hide');
}

function afterLoad(){
  var ref=today0();
  CNS.forEach(function(c){
    var d=DATA[c]; if(!d||!d.kpi) return;
    d._wks=weeksKPI(d.kpi);
    var nd=dmyToDate(ngayXem(d.kpi));
    d._wm=pickWeekKPI(d._wks, nd||ref);
    d._met=null;
  });
  var base=null;
  for(var i=0;i<CNS.length;i++){ if(DATA[CNS[i]]&&DATA[CNS[i]].kh){ base=DATA[CNS[i]].kh; break; } }
  WKS = base?weeksKH(base):[];
  var want = null;
  try{
    var raw=localStorage.getItem('gb_week')||'';
    var pr=raw.split('@');
    if(pr.length===2 && pr[1]===dayKey()) want=pr[0];
  }catch(e){}
  WQ = (want&&wkByNo(+want)) || pickWeekKH(WKS,ref) || null;
  storeReset();

  var sel=document.getElementById('wkSel');
  BUILDING=true;
  sel.innerHTML = WKS.map(function(w){
    return '<option value="'+w.w+'"'+(WQ&&w.w===WQ.w?' selected':'')+'>W'+w.w+(w.txt?' · '+w.txt:'')+'</option>';
  }).join('') || '<option>—</option>';
  if(WQ) sel.value=String(WQ.w);
  BUILDING=false;

  var okn=CNS.filter(function(c){ return DATA[c]&&DATA[c].kpi; }).length;
  var A=buildAudit(), warn=A.filter(function(x){ return x[1]==='warn'; }).length;
  document.getElementById('subTitle').innerHTML =
    (WQ?esc(WQ.label.replace(/\s+/g,' ')):'') + ' · đọc được ' + okn + '/3 chi nhánh'
    + (warn?' · <b style="color:#FCE500">'+warn+' điểm cần tra soát</b>':' · số liệu sạch')
    + ' · ' + new Date().toLocaleTimeString('vi-VN');

  fromHash(); paintRail(); paintStage(); tmrReset();
}
