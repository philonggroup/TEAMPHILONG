<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taplo KPI quản lý</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap">
<style>
:root{
  --red:#E03131; --amb:#F2B705; --grn:#1B9D6F; --grn-d:#0E7A52; --blu:#2CA9BC;
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#13201A; --ink2:#5C6B62; --ink3:#8A978E;
  --line:#E3EBE4; --track:#EAF0EB; --shadow:0 2px 14px rgba(14,122,82,.08);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0C1411; --card:#151F19; --ink:#EAF1EC; --ink2:#9DAFA3; --ink3:#71857A;
  --line:#25322A; --track:#1E2A23; --shadow:0 2px 14px rgba(0,0,0,.5); --red:#FF6B6B; --grn:#2BC48C;
}}
:root[data-theme="dark"]{
  --bg:#0C1411; --card:#151F19; --ink:#EAF1EC; --ink2:#9DAFA3; --ink3:#71857A;
  --line:#25322A; --track:#1E2A23; --shadow:0 2px 14px rgba(0,0,0,.5); --red:#FF6B6B; --grn:#2BC48C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:28px}
.ic{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- đầu trang: vạch xuất phát ---------- */
.top{position:relative;background:linear-gradient(135deg,var(--grn),var(--grn-d));color:#fff;padding:14px 16px 42px;border-radius:0 0 26px 26px;overflow:hidden}
.top .flag{position:absolute;inset:0 0 auto 0;height:10px;
  background-image:linear-gradient(45deg,rgba(255,255,255,.75) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.75) 75%),
                   linear-gradient(45deg,rgba(255,255,255,.75) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.75) 75%);
  background-size:10px 10px;background-position:0 0,5px 5px;opacity:.5}
.top .t1{font-size:19px;font-weight:800;margin-top:10px;display:flex;align-items:center;gap:8px}
.top .t1 .ic{font-size:22px;stroke-width:2.2}
.top .t2{font-size:12.5px;opacity:.93;margin-top:3px}
.wrap{max-width:520px;margin:-28px auto 0;padding:0 13px}

/* ---------- linh vật ---------- */
.mot{position:relative;display:flex;align-items:flex-end;gap:10px;background:var(--card);background:linear-gradient(135deg,color-mix(in srgb,var(--vc,var(--grn)) 13%,var(--card)),var(--card) 62%);border:1px solid var(--line);border-radius:18px;padding:10px 12px 15px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;user-select:none}
.mot .rong{position:relative;flex:0 0 78px;width:78px;animation:rong-in .6s cubic-bezier(.2,1.3,.4,1) both}
.mot .rong img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 9px rgba(0,0,0,.22))}
.mot .rong .fb{display:block;font-size:44px;text-align:center}
.mot .prop{position:absolute;right:-9px;top:44%;width:29px;height:29px;border-radius:50%;background:#fff;border:2px solid var(--vc,var(--grn));display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.mot .bub{position:relative;flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:9px 11px 10px;margin-bottom:6px}
.mot .bub::before{content:"";position:absolute;left:-7px;bottom:16px;border:7px solid transparent;border-right-color:var(--line)}
.mot .bub::after{content:"";position:absolute;left:-5px;bottom:16px;border:6px solid transparent;border-right-color:var(--bg)}
.mot .hi{font-size:11px;font-weight:700;color:var(--grn);letter-spacing:.03em;text-transform:uppercase}
.mot .msg{font-size:12.8px;font-weight:600;margin-top:3px;line-height:1.4}
.mot .tag{display:inline-block;margin-top:7px;font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--grn);color:#fff}
.mot .bar{position:absolute;left:12px;right:12px;bottom:6px;height:3px;border-radius:3px;background:var(--track);opacity:.75}
.mot .bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--vc,var(--amb))}
.mot.run .bar i{animation:mot-run 9s linear forwards}
.mot .fade{animation:mot-fade .45s ease}
.mot[data-v="c3"] .rong{animation:rong-in .6s cubic-bezier(.2,1.3,.4,1) both,pose-chao 2.4s ease-in-out .6s infinite}
.mot[data-v="s5"] .rong{animation:rong-in .6s cubic-bezier(.2,1.3,.4,1) both,pose-quet 2.1s ease-in-out .6s infinite}
.mot[data-v="plg"] .rong{animation:rong-in .6s cubic-bezier(.2,1.3,.4,1) both,pose-buoc 3.1s ease-in-out .6s infinite}
.mot[data-v="goal"] .rong,.mot[data-v="kpi"] .rong{animation:rong-in .6s cubic-bezier(.2,1.3,.4,1) both,pose-nhay 1.9s ease-in-out .6s infinite}
@keyframes rong-in{0%{transform:translateY(16px) scale(.86);opacity:0}100%{transform:none;opacity:1}}
@keyframes pose-chao{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
@keyframes pose-quet{0%,100%{transform:translateX(0)}50%{transform:translateX(5px) rotate(2.5deg)}}
@keyframes pose-buoc{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-3px) rotate(1deg)}}
@keyframes pose-nhay{0%,100%{transform:translateY(0)}45%{transform:translateY(-7px)}70%{transform:translateY(0) scaleY(.98)}}
@keyframes mot-run{from{width:0}to{width:100%}}
@keyframes mot-fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.seg{display:flex;background:var(--track);border-radius:999px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;font:800 13px/1 'Be Vietnam Pro',sans-serif;color:var(--ink2);padding:10px 6px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
h2{font-size:12.5px;font-weight:800;color:var(--ink2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:7px}
h2 .ic{font-size:17px;color:var(--grn)}
h2 em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:0;text-transform:none}

/* ---------- đồng hồ tốc độ ---------- */
.gauge{display:block;width:100%;max-width:330px;margin:0 auto}
.gtxt{font:800 44px/1 'Be Vietnam Pro',sans-serif;fill:var(--ink)}
.gsub{font:700 13px/1 'Be Vietnam Pro',sans-serif;fill:var(--ink3)}
.gtick{font:800 10px/1 'Be Vietnam Pro',sans-serif;fill:var(--ink3)}
.gbig{font:800 19px/1 'Be Vietnam Pro',sans-serif;fill:var(--ink)}
.light{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;font-weight:800;font-size:15px}
.light .bulb{width:16px;height:16px;border-radius:50%}
.sub3{display:flex;gap:7px;margin-top:12px}
.sub3 .s{flex:1;border:1px solid var(--line);border-radius:14px;padding:9px 8px;background:var(--bg);text-align:center}
.sub3 .s .ic{font-size:20px;margin:0 auto 4px}
.sub3 .s b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.sub3 .s i{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink3);margin-top:1px}
.sub3 .s u{display:block;text-decoration:none;font-size:12px;font-weight:800;margin-top:3px}

/* ---------- đường đua tháng ---------- */
.track{position:relative;height:52px;margin:6px 0 4px;background:var(--track);border-radius:14px;overflow:hidden}
.track .road{position:absolute;left:0;right:0;top:50%;height:4px;transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,var(--ink3) 0 10px,transparent 10px 20px);opacity:.45}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c,var(--grn)) 26%,transparent))}
.track .goal{position:absolute;top:0;bottom:0;width:10px;
  background-image:linear-gradient(45deg,var(--ink3) 25%,transparent 25%,transparent 75%,var(--ink3) 75%),
                   linear-gradient(45deg,var(--ink3) 25%,transparent 25%,transparent 75%,var(--ink3) 75%);
  background-size:8px 8px;background-position:0 0,4px 4px;opacity:.8}
.track .mark{position:absolute;top:3px;bottom:3px;width:2px;background:var(--ink3);opacity:.85}
.track .mark b{position:absolute;top:-2px;left:4px;font-size:9.5px;font-weight:800;color:var(--ink3);white-space:nowrap}
.track .car{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:26px;line-height:1;transition:left .9s cubic-bezier(.3,1.2,.4,1)}
.sum{display:flex;gap:7px;margin-top:10px}
.sum .s{flex:1;text-align:center;border:1px solid var(--line);border-radius:14px;padding:9px 6px;background:var(--bg)}
.sum .s b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.sum .s i{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink3);margin-top:2px}

/* ---------- ô số lớn ---------- */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kc{border:1px solid var(--line);border-radius:16px;padding:11px 12px;background:var(--bg);display:flex;gap:9px;align-items:center}
.kc .ic{font-size:22px;color:var(--grn);flex:none}
.kc .kv{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kc .kl{font-size:10.5px;font-weight:700;color:var(--ink3);margin-top:2px}

/* ---------- dòng chỉ số có icon ---------- */
.r{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:none}
.r .ib{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c,var(--grn)) 15%,var(--card));color:var(--c,var(--grn))}
.r .ib .ic{font-size:21px;stroke-width:2.1}
.r .mid{flex:1;min-width:0}
.r .nm{font-size:13.5px;font-weight:700;line-height:1.25}
.r .pb{height:6px;border-radius:6px;background:var(--track);margin-top:5px;overflow:hidden}
.r .pb i{display:block;height:100%;border-radius:6px;background:var(--c,var(--grn));transition:width .8s ease}
.r .rt{flex:none;text-align:right;min-width:74px}
.r .big{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.r .goal{font-size:10.5px;font-weight:700;color:var(--ink3);margin-top:1px}
.r .bd{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px;margin-top:3px;color:#fff;background:var(--c,var(--grn))}
.r .bd .ic{font-size:11px;stroke-width:3}

table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;text-align:right;padding:0 2px 7px}
th:first-child{text-align:left}
td{padding:8px 2px;font-size:13px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
td:first-child{text-align:left;font-weight:700;display:flex;align-items:center;gap:6px}
td:first-child .ic{font-size:16px;color:var(--ink3)}
tr:last-child td{border-bottom:none}
.foot{font-size:11px;color:var(--ink3);text-align:center;margin-top:14px;line-height:1.6}
.msgbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 15px;text-align:center;font-size:13.5px;font-weight:700;color:var(--ink2);box-shadow:var(--shadow)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="flag"></div>
  <div class="t1"><svg class="ic"><use href="#i-speed"/></svg><span id="qlName">Taplo KPI</span></div>
  <div class="t2" id="qlSub">Đang nổ máy…</div>
</div>

<div class="wrap">

  <div class="mot" id="motBox" data-v="kpi" role="button" tabindex="0"
       aria-label="Team Phi Long cổ vũ — chạm để xem lời tiếp theo" aria-live="polite"
       onclick="nextMot()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nextMot();}">
    <div class="rong">
      <img id="ava" src="rong-philong-full.png" alt="Team Phi Long"><span class="fb hide" id="avaFb">🐉</span>
      <span class="prop" id="motProp">🏁</span>
    </div>
    <div class="bub">
      <div class="hi" id="hi">CHÀO NGÀY MỚI</div>
      <div class="msg" id="msg">Đang lấy số liệu chi nhánh…</div>
      <span class="tag" id="motTag">TEAM PHI LONG</span>
    </div>
    <div class="bar"><i></i></div>
  </div>

  <div class="seg hide" id="segBox" role="group" aria-label="Chọn chi nhánh">

<script>
/* ======= NGUỒN: tab "BÁO CÁO KPI NGÀY T11" của 3 file chi nhánh ======= */
var SRC = {
  CN1:{ id:'1b2wcIrwdzgt1Sd67BbUMQTiOe4PFj1ShoSSzqS4x8sc', gid:'489409049',  ql:'PHẠM THÀNH LUÂN' },
  CN2:{ id:'1O8f-5602r5YB23MFHsLN8QZt9BZQOnV3abm8k8Kgn0k', gid:'1426227108', ql:'NGUYỄN THỊ THUỲ TRÂM' },
  CN3:{ id:'1B2eNY8T4iSf0E-UjGOmM30dcxqBOb6VZk1R4A4pXrVc', gid:'247752852',  ql:'HIỀN' }
};
var CN='CN2', ROWS=[], ADMIN=false;

function strip(s){ return (s==null?'':String(s)).replace(/\s+/g,' ').trim(); }
function noAcc(s){ return strip(s).toLowerCase()
  .replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g,'a').replace(/[èéẹẻẽêềếệểễ]/g,'e')
  .replace(/[ìíịỉĩ]/g,'i').replace(/[òóọỏõôồốộổỗơờớợởỡ]/g,'o')
  .replace(/[ùúụủũưừứựửữ]/g,'u').replace(/[ỳýỵỷỹ]/g,'y').replace(/đ/g,'d'); }
function num(s){
  s=strip(s).replace(/[●○\s]/g,'');
  if(!s) return null;
  s=s.replace(/[^\d,.\-]/g,'');
  if(!s||s==='-') return null;
  if(s.indexOf(',')>-1 && s.indexOf('.')>-1) s=s.replace(/\./g,'').replace(',','.');
  else if(s.indexOf(',')>-1) s=(s.split(',')[1]||'').length<=2 ? s.replace(',','.') : s.replace(/,/g,'');
  else if((s.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(s)) s=s.replace(/\./g,'');
  var v=parseFloat(s); return isNaN(v)?null:v;
}
function fm(n){ return n===null||n===undefined?'—':Math.round(n).toLocaleString('vi-VN'); }
function fmShort(n){
  if(n===null||n===undefined) return '—';
  var x=Math.round(n);
  if(Math.abs(x)>=1e9) return (x/1e9).toFixed(Math.abs(x)%1e9===0?0:2).replace('.',',')+' tỷ';
  if(Math.abs(x)>=1e6) return (x/1e6).toFixed(Math.abs(x)%1e6===0?0:1).replace('.',',')+' tr';
  return fm(x);
}
function p1(v){ return v===null?'—':(Math.round(v*10)/10).toString().replace('.',',')+'%'; }
function col(p){ return p===null?'var(--ink3)':(p>=100?'var(--grn)':(p>=70?'var(--amb)':'var(--red)')); }
function word(p){ return p===null?'CHƯA CÓ SỐ':(p>=100?'ĐẠT':(p>=70?'GẦN ĐẠT':'CHƯA ĐẠT')); }

function parseCSV(t){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  row.push(f); rows.push(row); return rows;
}
function findRow(frag){
  var k=noAcc(frag);
  for(var i=0;i<ROWS.length;i++){ var b=noAcc(ROWS[i][1]||''); if(b&&b.indexOf(k)>-1) return ROWS[i]; }
  return null;
}
function cell(r,i){ return r&&r[i]!==undefined?r[i]:''; }
function metric(frag){
  var r=findRow(frag);
  if(!r) return {val:null,kpi:null,p:null};
  var val=num(cell(r,2)), kpi=num(cell(r,3)), p=num(cell(r,4));
  if(p===null && kpi) p=(val===null?0:val)/kpi*100;
  if(val===null && kpi!==null) val=0;
  return {val:val,kpi:kpi,p:p};
}

/* ---------- ĐỒNG HỒ TỐC ĐỘ kiểu xe đua ---------- */
function gauge(p,center,sub){
  var CX=165,CY=170,R=118,A0=140,SW=260, max=150;
  function pol(a,r){ var x=a*Math.PI/180; return [CX+r*Math.cos(x),CY+r*Math.sin(x)]; }
  function arc(a1,a2,r){
    var s=pol(a1,r),e=pol(a2,r),big=(a2-a1)>180?1:0;
    return 'M'+s[0].toFixed(1)+' '+s[1].toFixed(1)+'A'+r+' '+r+' 0 '+big+' 1 '+e[0].toFixed(1)+' '+e[1].toFixed(1);
  }
  function ang(v){ return A0+SW*Math.max(0,Math.min(1,v/max)); }
  var zones=[[0,70,'var(--red)'],[70,100,'var(--amb)'],[100,max,'var(--grn)']];
  var h='<svg class="gauge" viewBox="0 0 330 250" role="img" aria-label="Đồng hồ tốc độ">';
  h+='<path d="'+arc(A0,A0+SW,R)+'" fill="none" stroke="var(--track)" stroke-width="26" stroke-linecap="round"/>';
  zones.forEach(function(z){
    h+='<path d="'+arc(ang(z[0])+(z[0]===0?0:1.2),ang(z[1])-1.2,R)+'" fill="none" stroke="'+z[2]+'" stroke-width="26" opacity="'+
       ((p!==null&&p>=z[0]&&(p<z[1]||z[1]===max))?'1':'.28')+'"/>';
  });
  for(var v=0;v<=max;v+=25){
    var a=ang(v),i1=pol(a,R-17),o1=pol(a,R+14),t=pol(a,R+30);
    h+='<line x1="'+i1[0].toFixed(1)+'" y1="'+i1[1].toFixed(1)+'" x2="'+o1[0].toFixed(1)+'" y2="'+o1[1].toFixed(1)+'" stroke="var(--line)" stroke-width="3"/>';
    h+='<text class="gtick" x="'+t[0].toFixed(1)+'" y="'+(t[1]+4).toFixed(1)+'" text-anchor="middle">'+v+'</text>';
  }
  var a2=ang(p===null?0:p), ca=Math.cos(a2*Math.PI/180), sa=Math.sin(a2*Math.PI/180);
  var tip=[CX+(R-20)*ca,CY+(R-20)*sa], bl=[CX-18*ca-8*sa,CY-18*sa+8*ca], br=[CX-18*ca+8*sa,CY-18*sa-8*ca];
  h+='<path d="M'+tip[0].toFixed(1)+' '+tip[1].toFixed(1)+'L'+br[0].toFixed(1)+' '+br[1].toFixed(1)+'L'+bl[0].toFixed(1)+' '+bl[1].toFixed(1)+'Z" fill="'+col(p)+'"/>';
  h+='<circle cx="'+CX+'" cy="'+CY+'" r="13" fill="var(--card)" stroke="'+col(p)+'" stroke-width="5"/>';
  h+='<text class="gtxt" x="'+CX+'" y="150" text-anchor="middle" fill="'+col(p)+'">'+(p===null?'—':Math.round(p)+'%')+'</text>';
  h+='<text class="gbig" x="'+CX+'" y="203" text-anchor="middle">'+center+'</text>';
  h+='<text class="gsub" x="'+CX+'" y="224" text-anchor="middle">'+sub+'</text>';
  h+='</svg>';
  return h;
}

        return '<td style="color:'+col(p)+'">'+(d[3]?fmShort(th):fm(th))+(p===null?'':'<br><span style="font-size:10.5px">'+Math.round(p)+'%</span>')+'</td>';
      }).join('');
      h+='<tr><td><svg class="ic"><use href="#'+d[1]+'"/></svg>'+d[2]+'</td>'+tds+'</tr>';
    });
    document.getElementById('weekTbl').innerHTML=h;
  } else wc.classList.add('hide');

  document.getElementById('foot').innerHTML='Nguồn: tab “BÁO CÁO KPI NGÀY T11” — file KPI '+CN
    +'<br>Cập nhật '+new Date().toLocaleTimeString('vi-VN')+' · 🔴 dưới 70% · 🟡 70–99% · 🟢 đạt 100%';
  document.getElementById('loading').classList.add('hide');
  document.getElementById('body').classList.remove('hide');
  motivate(ptrm);
}
function findRowDate(){
  for(var i=0;i<Math.min(6,ROWS.length);i++){ if(noAcc(ROWS[i][1]||'').indexOf('chon ngay')>-1) return ROWS[i]; }
  return null;
}

function load(){
  var s=SRC[CN], t=Date.now(), i=0;
  var list=['https://docs.google.com/spreadsheets/d/'+s.id+'/export?format=csv&gid='+s.gid+'&_='+t,
            'https://docs.google.com/spreadsheets/d/'+s.id+'/gviz/tq?tqx=out:csv&gid='+s.gid+'&_='+(t+1)];
  document.getElementById('body').classList.add('hide');
  document.getElementById('loading').classList.remove('hide');
  document.getElementById('loading').textContent='Đang tải taplo KPI của '+CN+'…';
  function next(){
    if(i>=list.length){
      document.getElementById('loading').innerHTML='Không đọc được file KPI '+CN
        +'.<br>Kiểm tra file đã bật chia sẻ “bất kỳ ai có liên kết · người xem” chưa.';
      motivate(null); return;
    }
    fetch(list[i++],{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(t2){ ROWS=parseCSV(t2); if(ROWS.length<10) throw 0; render(); })
      .catch(function(){ next(); });
  }
  next();
}
function setCN(c){
  CN=c;
  ['CN1','CN2','CN3'].forEach(function(x){
    var b=document.getElementById('tab-'+x); if(b) b.setAttribute('aria-pressed', x===c);
  });
  try{ if(ADMIN) localStorage.setItem('kpiql_cn',c); }catch(e){}
  load();
}
(function init(){
  var q; try{ q=new URLSearchParams(location.search); }catch(e){ q=new URLSearchParams(''); }
  var ten=q.get('ten')||'', cn=(q.get('cn')||'').toUpperCase();
  ADMIN=q.get('admin')==='1'||q.get('all')==='1';
  if(!cn && ten){
    var n=noAcc(ten);
    if(n.indexOf('luan')>-1) cn='CN1';
    else if(n.indexOf('tram')>-1) cn='CN2';
    else if(n.indexOf('hien')>-1) cn='CN3';
  }
  if(!cn){ try{ cn=localStorage.getItem('kpiql_cn')||''; }catch(e){} }
  if(!SRC[cn]) cn='CN2';
  if(ten) SRC[cn].ql=ten.toUpperCase();
  if(ADMIN) document.getElementById('segBox').classList.remove('hide');
  var img=document.getElementById('ava');
  function noAva(){ img.classList.add('hide'); document.getElementById('avaFb').classList.remove('hide'); }
  img.addEventListener('error',noAva);
  if(img.complete && !img.naturalWidth) noAva();
  motivate(null);
  setCN(cn);
})();
</script>
